<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Worker Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="container">

    <button onclick="window.location.href='/frontend/'" class="back-btn">← Back</button>

    <h1>Worker Dashboard</h1>

    <!-- Entry form -->
    <form id="entryForm" class="entry-row">
      <input type="text" id="project" placeholder="Project (optional)">
      <input type="text" id="task" placeholder="Task description" required>
      <input type="number" id="hours" step="0.25" placeholder="Hours worked" required>
      <input type="date" id="date" placeholder="Date" required>
      <button type="submit">Add Entry</button>
    </form>

    <h2>Your Time Entries</h2>

    <!-- Daily entries table -->
    <div id="entries"></div>

  </div>

  <script>
    async function loadEntries() {
      const res = await fetch("/timeentries");
      const data = await res.json();

      renderEntries(data);
    }

    function formatDate(dateStr) {
      const d = new Date(dateStr);
      return d.toLocaleDateString();
    }

    function getHours(start, end) {
      const s = new Date(start);
      const e = new Date(end);
      return (e - s) / 1000 / 3600;
    }

    function renderEntries(entries) {
      const entriesDiv = document.getElementById("entries");

      if (entries.length === 0) {
        entriesDiv.innerHTML = "<p>No entries yet.</p>";
        return;
      }

      let html = `
        <table>
          <tr><th>Date</th><th>Project</th><th>Description</th><th>Hours</th></tr>
      `;

      let totalHours = 0;

      entries.forEach(e => {
        const h = getHours(e.StartTime, e.EndTime);
        totalHours += h;

        html += `
          <tr>
            <td>${formatDate(e.StartTime)}</td>
            <td>${e.Project || ""}</td>
            <td>${e.Description}</td>
            <td>${h.toFixed(2)}</td>
          </tr>
        `;
      });

      html += "</table>";

      html += `
        <div class="summary-box">
          <strong>Total hours recorded:</strong> ${totalHours.toFixed(2)}
        </div>
      `;

      entriesDiv.innerHTML = html;
    }

    // Default date input to current day (YYYY-MM-DD)
    const dateInput = document.getElementById("date");
    dateInput.value = new Date().toISOString().split("T")[0];

    // Handle form submission
    document.getElementById("entryForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const dateStr = dateInput.value;
      const project = document.getElementById("project").value;
      const description = document.getElementById("task").value;
      const hours = parseFloat(document.getElementById("hours").value);

      if (isNaN(hours) || hours <= 0) {
        alert("Hours must be greater than zero.");
        return;
      }

      const start = new Date(`${dateStr}T00:00:00`);
      if (isNaN(start.getTime())) {
        alert("Please provide a valid date.");
        return;
      }
      const end = new Date(start.getTime() + hours * 3600 * 1000);

      // Create entry object (payload)
      const entry = {
        Description: description,
        Project: project,
        StartTime: start.toISOString(),
        EndTime: end.toISOString()
      };

      // Send POST request to add entry
      const res = await fetch("/timeentries", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(entry)
      });

      if (!res.ok) { // Error handling
        alert("Failed to add entry");
        return;
      }

      e.target.reset(); // Clear form
      dateInput.value = new Date().toISOString().split("T")[0]; // Reset date back to today
      
      loadEntries();
    });

    loadEntries();
  </script>

</body>
</html>
